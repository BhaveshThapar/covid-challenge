# Experiment: ConvNeXt-Tiny + Focal Loss + Embedding Mixup, Seed 42
# Different backbone for ensemble diversity — 768-dim features

data:
  data_dir: "data"
  image_size: 256
  slices_per_scan: 24
  num_workers: 4
  pin_memory: true

model:
  backbone: "convnext_tiny"       # CHANGED: different architecture
  pretrained: true
  embedding_dim: 768              # ConvNeXt-Tiny feature dimension
  attention_hidden_dim: 256
  classifier_hidden_dim: 384      # scaled proportionally (768/1536 * 512)
  dropout: 0.5
  drop_path_rate: 0.3
  num_classes: 2

phase1:
  epochs: 20
  batch_size: 8
  lr: 1.0e-4
  weight_decay: 0.01
  freeze_bn_epochs: 2
  warmup_epochs: 2
  max_val_slices_per_scan: 32
  label_smoothing: 0.1
  loss_type: "cross_entropy"

phase2:
  epochs: 30
  batch_size: 2
  lr: 1.0e-5
  weight_decay: 0.05
  warmup_epochs: 3
  gradient_accumulation_steps: 16
  use_amp: true
  freeze_backbone_epochs: 3
  backbone_lr_factor: 0.1
  label_smoothing: 0.05
  loss_type: "focal"
  focal_gamma: 2.0
  focal_alpha: [0.55, 0.45]
  mixup_alpha: 0.2
  early_stopping_patience: 8

eval:
  slices_per_scan: 48
  batch_size: 1
  tta: true
  threshold_sweep: true

seed: 42
checkpoint_dir: "checkpoints/exp_cnxt_s42"
log_dir: "logs/exp_cnxt_s42"
