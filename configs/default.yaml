# Multi-Source Covid-19 Detection — Improved Configuration v2
# Changes from baseline annotated with arrows (↑/↓/NEW)

# Data
data:
  data_dir: "data"
  image_size: 256          # ↑ from 224: finer pathological detail
  slices_per_scan: 24      # ↑ from 16: 50% more scan coverage
  num_workers: 4
  pin_memory: true

# Model
model:
  backbone: "efficientnet_b3"
  pretrained: true
  embedding_dim: 1536
  attention_hidden_dim: 256
  classifier_hidden_dim: 512  # ↑ from 256: more classifier capacity
  dropout: 0.5               # ↑ from 0.3: stronger regularization
  drop_path_rate: 0.3        # NEW: stochastic depth in backbone
  num_classes: 2

# Training — Phase 1 (Slice-level pretraining)
phase1:
  epochs: 20               # ↑ from 5: properly train the backbone
  batch_size: 8
  lr: 1.0e-4
  weight_decay: 0.01
  freeze_bn_epochs: 2
  warmup_epochs: 2          # ↑ from 1
  max_val_slices_per_scan: 32
  label_smoothing: 0.1      # NEW
  loss_type: "cross_entropy"

# Training — Phase 2 (Scan-level end-to-end)
phase2:
  epochs: 30               # ↑ from 15: with early stopping
  batch_size: 2            # ↓ from 4: accommodate 256px + 24 slices
  lr: 1.0e-5              # ↓ from 3e-5: slower learning, small dataset
  weight_decay: 0.05       # ↑ from 0.01: stronger regularization
  warmup_epochs: 3         # ↑ from 1: stable early training
  gradient_accumulation_steps: 16  # effective batch = 32
  use_amp: true
  freeze_backbone_epochs: 3  # NEW: train head only for 3 epochs first
  backbone_lr_factor: 0.1    # NEW: backbone gets 10x lower LR after unfreeze
  label_smoothing: 0.1       # NEW
  loss_type: "cross_entropy"
  mixup_alpha: 0.0           # Set > 0 (e.g. 0.2) to enable embedding mixup
  early_stopping_patience: 8  # ↑ from 5

# Evaluation
eval:
  slices_per_scan: 48       # ↑ from 32: more complete scan representation
  batch_size: 1             # ↓ from 2: fit 48 slices safely in memory
  tta: true                 # NEW: test-time augmentation (hflip)
  threshold_sweep: true     # NEW: sweep classification threshold for optimal F1

# Misc
seed: 42
checkpoint_dir: "checkpoints"
log_dir: "logs"
