# Multi-Source Covid-19 Detection — Default Configuration
# Aadit's pipeline: DenseNet-121 + RadImageNet, slice-level training, scan-level evaluation

# Data
data:
  data_dir: "data"
  image_size: 224
  slices_per_scan: 64          # Max slices sampled per scan during slice-level training
  num_workers: 8
  pin_memory: true

# Model
model:
  backbone: "densenet121"
  pretrained_path: "checkpoints/radimagenet_densenet121.pt"
  embedding_dim: 1024          # DenseNet-121 feature dim
  dropout: 0.4

# Phase 1: Frozen backbone, head-only fine-tuning
phase1:
  epochs: 10
  batch_size: 32               # Used by CenterBatchSampler
  lr: 1.0e-3
  weight_decay: 1.0e-4
  warmup_epochs: 1             # Real linear warmup via SequentialLR
  early_stop_patience: 10
  label_smoothing: 0.05        # ε: hard labels → (ε/2, 1-ε/2)
  use_focal_loss: false        # true → FocalLoss(gamma=2) instead of BCEWithLogitsLoss

# Phase 2: Gradual backbone unfreezing
phase2:
  # Sub-phase 2a: unfreeze denseblock4 + norm5
  block4_epochs: 15
  block4_lr: 1.0e-4

  # Sub-phase 2b: additionally unfreeze denseblock3 + transition3
  block3_epochs: 15
  block3_lr: 3.0e-5

  head_lr: 1.0e-3              # Classifier head LR (constant across both sub-phases)
  weight_decay: 1.0e-4
  warmup_restarts_T0: 5        # CosineAnnealingWarmRestarts T_0 (epochs per restart)
  use_amp: true                # Mixed precision (FP16)
  early_stop_patience: 10
  label_smoothing: 0.05
  use_focal_loss: false
  full_val_every_n_epochs: 999 # Disabled during training (OOM on full-slice); run via evaluate.py

# Evaluation
eval:
  slices_per_scan: -1          # -1 = all slices (final evaluation)
  val_slices_per_scan: 48      # Slices per scan during training validation (speed/accuracy tradeoff)
  batch_size: 1
  threshold: 0.5               # Default threshold; overridden by tune_threshold sweep
  threshold_lo: 0.3
  threshold_hi: 0.7
  threshold_steps: 41          # 0.01 increments over [0.30, 0.70]
  tta_n: 4                     # TTA augmentations at inference (0 = disable)

# K-Fold Cross-Validation
kfold:
  n_splits: 3                  # Number of folds (K); total compute = K × (P1 + P2a + P2b)

# Misc
seed: 42
checkpoint_dir: "checkpoints"
log_dir: "logs"
