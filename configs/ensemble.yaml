# Ensemble configuration — Majority vote (DINOv2, DenseNet, EfficientNet)
# Each model predicts 0/1; final prediction = majority per scan

ensemble:
  threshold: 0.5  # threshold for binarizing each model's P(covid) before voting

models:
  dinov2:
    config: configs/dinov2.yaml
    checkpoint: checkpoints/v1_ovr_best.pt
  densenet:
    config: configs/densenet.yaml
    checkpoint: checkpoints/v4_ovr_best.pt
  efficientnet:
    config: configs/efficientnet.yaml
    checkpoint: checkpoints/best.pt
